<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video, Audio & Media in HTML</title>
</head>

<body>
    <!-- Main video with thumbnail -->
    <video src="video.mp4" height="700" poster="image.webp" loop controls>Swallowed Star</video>

    <h1>Music:</h1>
    <!-- Audio player -->
    <audio src="Rosemary_spotdown.org.mp3" controls></audio>

    <!-- Inline SVG star (Gold) -->
    <svg id="test-star" width="100" height="100" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
            fill="gold" />

    <!-- Swallowed Star Wiki embed -->
    <iframe src="https://swallowed-star.fandom.com/" width="100%" height="700"></iframe>
</body>

</html>
